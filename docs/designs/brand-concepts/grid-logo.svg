<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 100" role="img" aria-labelledby="title">
  <title id="title">MizukiPanel · 模块窗格</title>
  <defs>
    <linearGradient id="mp-spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f0a9d0" />
      <stop offset=".48" stop-color="#aa94e3" />
      <stop offset="1" stop-color="#49b6df" />
    </linearGradient>
    <linearGradient id="mp-water" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#33c0dc" />
      <stop offset="1" stop-color="#397bd8" />
    </linearGradient>
  </defs>
  <style>svg{color:#1da5d1;--mp-secondary:url(#mp-water);--mp-fold:url(#mp-spectrum)}.panel{fill:#24272d}@media(prefers-color-scheme:dark){.panel{fill:#f0f2f6}}</style>
  <g aria-hidden="true">
    <rect x="10" y="14" width="23" height="72" rx="10" fill="currentColor" />
    <rect x="39" y="14" width="23" height="30" rx="10" fill="var(--mp-fold, currentColor)" />
    <rect x="68" y="14" width="23" height="72" rx="10" fill="var(--mp-secondary, currentColor)" />
    <rect x="39" y="50" width="23" height="36" rx="10" fill="currentColor" opacity=".65" />
  </g>
  <text x="113" y="66" font-family="Segoe UI,Arial,sans-serif" font-size="47" letter-spacing="-1.6" font-weight="700" fill="currentColor">
    <tspan>Mizuki</tspan>
    <tspan class="panel" font-weight="400" font-family="Segoe UI,Arial,sans-serif">Panel</tspan>
  </text>
</svg>
